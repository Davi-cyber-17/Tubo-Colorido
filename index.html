<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050816">
  <title>Tubo Colorido</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-orb o1" aria-hidden="true"></div>
  <div class="bg-orb o2" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="app">
    <header class="hud">
      <div class="hud-cell">
        <small>NÍVEL</small>
        <strong id="levelNum">1</strong>
      </div>
      <div class="hud-cell mid">
        <small>PROGRESSO <b id="progTxt">0/0</b></small>
        <div class="progress"><i id="progBar"></i></div>
      </div>
      <div class="hud-cell right">
        <small>JOGADAS</small>
        <strong id="moves">0</strong>
      </div>
    </header>

    <section id="board" class="board"></section>

    <nav class="controls">
      <button id="btnUndo" class="btn" aria-label="Desfazer">
        <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12"/></svg><span>Desfazer</span>
      </button>
      <button id="btnRestart" class="btn" aria-label="Reiniciar">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg><span>Reiniciar</span>
      </button>
      <button id="btnAdd" class="btn" aria-label="Adicionar tubo">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Tubo</span><em id="addLeft">1</em>
      </button>
      <button id="btnSkip" class="btn" aria-label="Pular nível">
        <svg viewBox="0 0 24 24"><path d="m5 5 8 7-8 7zM17 5v14"/></svg><span>Pular</span>
      </button>
    </nav>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <small>// MISSÃO CUMPRIDA</small>
      <h2>NÍVEL COMPLETO</h2>
      <p>Concluído em <b id="finalMoves">0</b> jogadas</p>
      <button id="btnNext" class="btn big"><span>Próximo nível</span><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
  </div>

  <div id="confetti"></div>
  <script src="script.js"></script>
</body>
</html>
